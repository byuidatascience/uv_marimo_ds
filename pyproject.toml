[project]
name = "uv-marimo-ds"
version = "0.1.0"
description = "A simple data science environment using UV and Marimo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.9.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4.0",
    "plotly>=5.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
