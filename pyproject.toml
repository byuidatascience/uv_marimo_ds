[project]
name = "uv-marimo-ds"
version = "0.1.0"
description = "A simple data science environment using UV and Marimo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.9.0",
    "polars[numpy, pyarrow, excel, database, fsspec, async, graph, plot, style, timezone]==1.38.1",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "plotly>=5.18.0",
    "lets-plot>=4.8.2"
]

[tool.uv]
package = false

[dependency-groups]
dev = []

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"
